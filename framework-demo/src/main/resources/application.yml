server:
  port: 8080

spring:
  application:
    name: framework-demo
  mvc:
    throw-exception-if-no-handler-found: true

# ==================== 框架配置 ====================
# 全部能力均通过 framework.* 前缀配置，由 framework-boot-autoconfigure 统一绑定
framework:
  # ---------- 数据访问（JDBC 路径） ----------
  data:
    enabled: true
    type: jdbc                      # jdbc | mybatis，缺省 jdbc
    datasource:
      url: jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      pool-type: HIKARI             # HIKARI | DRUID | SIMPLE
      maximum-pool-size: 10
    jdbc:
      sql-log-enabled: true         # 打印 SQL，便于观察
      slow-sql-threshold: 200       # 慢 SQL 阈值（毫秒）
      tenant-enabled: false         # 多租户拦截器，按需开启

  # ---------- 缓存 ----------
  cache:
    enabled: true
    metrics: true                   # 将命中率暴露为 Micrometer 指标

  # ---------- 国际化 ----------
  i18n:
    enabled: true
    source: properties              # properties | database
    basename: messages              # 对应 resources 下的 messages*.properties
    resolver: parameter             # 从请求参数解析区域
    default-locale: zh_CN
    supported-locales:
      - zh_CN
      - en_US

  # ---------- 日志门面 ----------
  logger:
    enabled: true
    desensitize-enabled: true       # 日志输出前自动脱敏手机号/身份证等
    level: info

  # ---------- 扩展能力 ----------
  extras:
    enabled: true
    # Web 扩展：限流 / 幂等 / 加解密 / 签名 / 验证码 / 操作日志 / 数据权限
    web:
      ratelimit:
        enabled: true
      idempotent:
        enabled: true
      lock:
        enabled: true
      crypto:
        enabled: true
        default-key-alias: default
        keys:
          default: QUJDREVGMTIzNDU2Nzg5MA==   # Base64：ABCDEF1234567890
      sign:
        enabled: true
        app-secrets:
          demo-app: demo-secret
      captcha:
        enabled: true
        type: ARITHMETIC            # GRAPHIC | ARITHMETIC | SLIDER | SMS
        length: 4
        expire-seconds: 120
      operatelog:
        enabled: true
        async: true
      datapermission:
        enabled: true               # 演示用 DataPermissionRule 已注入（见 DemoExtrasConfig）
    # 文件存储：默认本地磁盘，切换 MinIO/OSS/S3 只需改 type 与连接参数
    storage:
      enabled: true
      type: LOCAL                   # LOCAL | MINIO | OSS | S3
      base-path: ./data/storage
      naming-strategy: DATE         # ORIGINAL | UUID | DATE | HASH
    # 消息
    message:
      enabled: true
      default-channel: sms
      max-retries: 2
      async: false

# ==================== 监控端点 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    cn.jowen.framework: INFO
    cn.jowen.framework.demo: DEBUG
